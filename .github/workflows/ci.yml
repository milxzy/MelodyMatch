name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Run matching algorithm tests
        run: npm test -- --testPathPattern=matching
        working-directory: server
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci-at-least-32-chars-long
          SESSION_SECRET: test-session-secret
          CONNECTION_STRING: mongodb://localhost:27017/test

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Lint client
        run: npm run lint
        working-directory: client
        continue-on-error: true
